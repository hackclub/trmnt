# Postgres for local development (`bun run db:start`). Production uses a database managed by Orchard.
# Named after this directory's old name, so it keeps starting the existing local database
# (volume frontend_db) instead of creating an empty one.
name: frontend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trmnt
      POSTGRES_PASSWORD: trmnt
      POSTGRES_DB: trmnt
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
